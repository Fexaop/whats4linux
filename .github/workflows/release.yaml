name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Nightly build at 02:00 UTC
    - cron: "0 2 * * *"

env:
  IS_NIGHTLY: ${{ github.event_name == 'schedule' }}

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check nightly state
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin             "refs/tags/nightly:refs/tags/nightly"             2>/dev/null || true

          nightly_sha="$(git rev-list -n 1 nightly 2>/dev/null || true)"

          if [ "$GITHUB_SHA" = "$nightly_sha" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            binary: Whats4Linux-Linux-x86_64.AppImage
            artifact: whats4linux-linux-amd64
            webkit: true

          - os: windows-latest
            platform: windows/amd64
            binary: whats4linux-windows.exe
            artifact: whats4linux-windows-amd64
            webkit: false

          - os: macos-latest
            platform: darwin/amd64
            binary: whats4linux-darwin
            artifact: whats4linux-macos-amd64
            webkit: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Linux-only system deps
      - name: Install Linux dependencies
        if: matrix.webkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        shell: bash
        run: |
          cd systray
          go mod tidy
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go build -o whats4linux_tray.exe .
          else
            go build -o whats4linux_tray .
          fi
          cd ..

          wails build             -o "${{ matrix.binary }}"             ${{ matrix.webkit && '-tags webkit2_41' || '' }}             ${{ env.IS_NIGHTLY && '-ldflags "-s -w -X main.version=v1.0.0 -X main.buildType=nightly"' || '' }}

      - name: Download appimagetool
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv systray/whats4linux_tray packaging/AppImage/AppDir/usr/bin
          mv "build/bin/${{ matrix.binary }}" packaging/AppImage/AppDir/usr/bin/whats4linux
          chmod +x packaging/AppImage/AppDir/usr/bin/*
          ./appimagetool-x86_64.AppImage packaging/AppImage/AppDir
          mv Whats4Linux-x86_64.AppImage "build/bin/${{ matrix.binary }}"

      - name: Zip macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          mv systray/whats4linux_tray build/bin/whats4linux.app/Contents/MacOS/whats4linux_tray
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent             whats4linux.app             "${{ matrix.binary }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}${{ env.IS_NIGHTLY && '-nightly' || '' }}
          path: build/bin/${{ matrix.binary }}*

  publish-nightly:
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish nightly GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          prerelease: true
          files: dist/**/*

      - name: Update nightly tag
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly
